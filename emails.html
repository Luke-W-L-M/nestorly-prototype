<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Nestorly: Specialise for charity">
<meta property="og:description" content="Experts share their knowledge; firms donate 100% to the expert’s chosen charity.">
<meta property="og:url" content="https://luke-w-l-m.github.io/nestorly-prototype/emails.html">
<meta property="og:type" content="website">
<meta property="og:image" content="https://luke-w-l-m.github.io/nestorly-prototype/og-image.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Specialise for charity: three people talking over coffee at a round table">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nestorly: Specialise for charity">
<meta name="twitter:description" content="Experts share their knowledge; firms donate 100% to the expert’s chosen charity.">
<meta name="twitter:image" content="https://luke-w-l-m.github.io/nestorly-prototype/og-image.png?v=3">
<meta name="twitter:image:alt" content="Specialise for charity: three people talking over coffee at a round table">
<title>Emails · Nestorly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
main{max-width:860px;margin:0 auto;padding-block:56px 90px;display:flex;flex-direction:column;gap:40px}
.mail{display:flex;flex-direction:column;gap:10px}
.env{font-family:var(--ui);font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:2px;padding-left:4px}
.env b{color:var(--navy)}
.msg{background:var(--white);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.mh{background:var(--paper);border-bottom:3px solid var(--ink);padding:16px 26px}
.mh .logo{height:48px;width:auto;display:block}
.mb{padding:28px;display:flex;flex-direction:column;gap:14px}
.mb h2{margin:0;font-family:var(--head);font-weight:400;font-size:30px;line-height:1.1;text-transform:uppercase}
.mb p{margin:0;font-size:19px;max-width:60ch}
.mf{border-top:2px solid var(--soft);padding:14px 26px;font-size:15px;color:var(--muted)}
.who{font-family:var(--ui);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--white);border-radius:999px;padding:4px 12px;align-self:flex-start}
.inbox{display:flex;flex-direction:column;gap:22px}
.protonote{display:inline-block;vertical-align:middle;font-family:var(--ui);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--navy);border:2px dashed #C9C2B3;border-radius:10px;padding:4px 10px;margin-left:8px}
.sentlist{display:flex;flex-direction:column;gap:30px}
.seg{display:inline-flex;flex-wrap:wrap;border:3px solid var(--ink);border-radius:12px;overflow:hidden;align-self:flex-start}
.seg button{all:unset;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:16px;padding:10px 16px;color:var(--navy);background:#fff}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#F5F0E6}
.seg button:focus-visible{outline:3px solid var(--cobalt);outline-offset:-5px}
.empty{color:var(--muted);font-size:18px;border:3px dashed var(--ink);border-radius:16px;padding:20px;margin:0}
.more{all:unset;cursor:pointer;font-family:var(--ui);font-weight:700;color:var(--navy);text-decoration:underline;text-underline-offset:4px;align-self:flex-start}
</style>
</head><body>
<header id="site-head"></header>
<main class="gut">
  <div style="display:flex;flex-direction:column;gap:14px">
    <h1 class="page">Emails</h1>
    <p class="lead">Every alert in the prototype also creates the email we would send, newest first. Below them, the email designs for each step.</p>
  </div>
  <section class="inbox" aria-labelledby="inbox-h">
    <h2 class="sec" id="inbox-h" style="font-size:34px">Sent emails <span class="protonote">Prototype: nothing is really sent</span></h2>
    <div class="seg" role="group" aria-label="Show emails to" id="filt"></div>
    <div id="sent" class="sentlist"></div>
  </section>
  <h2 class="sec" style="font-size:34px">Email designs</h2>
  <div id="list"></div>
</main>
<footer id="site-foot"></footer>
<script src="store.js"></script>
<script src="site.js"></script>
<script>
const M=[
 ['To the expert','New request from Harbourline Capital','A firm would like your knowledge','James Okafor of Harbourline Capital would like a 1-hour video call about scaling seaweed farming in the Scottish Highlands. They\'ve pledged <b>£350</b> to Loch Broom Lifeboat Fund.','See the request','expert-dashboard.html'],
 ['To the firm','Inglebert accepted your request','You\'re booked in','The Hon. Inglebert Montgomery-Smythe accepted. Your video call is on <b>Wed 4 Nov at 10:00</b>. A calendar invite and video link are attached, and you can now see each other\'s contact details.','See your booking','firm-dashboard.html'],
 ['To the firm','Please donate £350 to Loch Broom Lifeboat Fund','Time to donate','Inglebert has pressed Send. Please donate <b>£350</b> on the charity\'s page within 48 hours, quoting reference <b>NE-0047</b>, then upload your receipt.','Donate and upload receipt','firm-dashboard.html'],
 ['To the expert','Harbourline Capital has donated','Your donation is on its way','Harbourline Capital has donated <b>£350</b> and uploaded its receipt. We\'ve asked Loch Broom Lifeboat Fund to confirm.','See the receipt','expert-dashboard.html'],
 ['To the expert, from the charity','Thank you from Loch Broom Lifeboat Fund','Thank you, Inglebert','Your knowledge raised <b>£350</b> for our crew. That keeps our inshore boat fuelled for six weeks. Your LinkedIn certificate is ready to share.','Share your certificate','expert-dashboard.html'],
 ['To the expert','Your profile is live','You\'re live on Nestorly','We\'ve checked your identity and LinkedIn. Firms can now find you and send requests. We\'ll email you each time one arrives.','View your profile','find.html']
];
const logo=window.DAPPER_LOGO('navy');
document.getElementById('list').outerHTML=M.map(m=>'<div class="mail"><span class="who">'+m[0]+'</span><div class="env"><span>From: <b>Nestorly</b> &lt;hello@nestorly.co.uk&gt;</span><span>Subject: <b>'+m[1]+'</b></span></div><div class="msg"><div class="mh">'+logo+'</div><div class="mb"><h2>'+m[2]+'</h2><p>'+m[3]+'</p><a class="btn" style="align-self:flex-start" href="'+m[5]+'">'+m[4]+'</a></div><div class="mf">Nestorly CIC · 100% of every donation goes to charity · <a class="link" href="legal.html#privacy">Privacy</a></div></div></div>').join('');
// Sent emails (2 Nov): one per alert, from the shared store, newest first
(function(){
  const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const me=DS.me(); let who=me?'me':'all', limit=10;
  const F=[['all','Everyone'],['expert','To experts'],['firm','To firms']].concat(me?[['me','Only mine']]:[]);
  function draw(){
    document.getElementById('filt').innerHTML=F.map(([k,l])=>'<button type="button" data-k="'+k+'" aria-pressed="'+(who===k)+'">'+l+'</button>').join('');
    document.querySelectorAll('#filt button').forEach(b=>b.onclick=()=>{ who=b.dataset.k; limit=10; draw(); });
    const list=DS.get().emails.filter(m=>who==='all'||(who==='me'?m.to===me.email:m.role===who));
    document.getElementById('sent').innerHTML=list.length?list.slice(0,limit).map(m=>'<div class="mail"><span class="who">To '+(m.role==='expert'?'the expert':'the firm')+'</span><div class="env"><span>From: <b>Nestorly</b> &lt;hello@nestorly.co.uk&gt;</span><span>To: <b>'+esc(m.toName)+'</b> &lt;'+esc(m.to)+'&gt;</span><span>Subject: <b>'+esc(m.subject)+'</b></span><span>'+esc(DS.when(m.at))+'</span></div>'+
      '<div class="msg"><div class="mh">'+logo+'</div><div class="mb"><h2>'+esc(m.heading)+'</h2><p>Hello '+esc(m.toName.split(' ')[0])+',</p><p>'+esc(m.body)+'</p><a class="btn" style="align-self:flex-start" href="'+esc(m.link)+'">'+esc(m.button)+' →</a></div><div class="mf">You\'re getting this because you have a Nestorly account. Choose which emails you get in your settings.</div></div></div>').join('')+
      (list.length>limit?'<button type="button" class="more" id="more">Show older emails ('+(list.length-limit)+' more)</button>':''):'<p class="empty">No emails yet.</p>';
    const mo=document.getElementById('more'); if(mo) mo.onclick=()=>{ limit+=10; draw(); };
  }
  draw(); addEventListener('dapper-change',draw);
})();
</script>
</body></html>
