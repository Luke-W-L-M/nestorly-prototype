<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Nestorly: Specialise for charity">
<meta property="og:description" content="Experts share their knowledge; firms donate 100% to the expert’s chosen charity.">
<meta property="og:url" content="https://luke-w-l-m.github.io/nestorly-prototype/expert-dashboard.html">
<meta property="og:type" content="website">
<meta property="og:image" content="https://luke-w-l-m.github.io/nestorly-prototype/og-image.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Specialise for charity: three people talking over coffee at a round table">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nestorly: Specialise for charity">
<meta name="twitter:description" content="Experts share their knowledge; firms donate 100% to the expert’s chosen charity.">
<meta name="twitter:image" content="https://luke-w-l-m.github.io/nestorly-prototype/og-image.png?v=2">
<meta name="twitter:image:alt" content="Specialise for charity: three people talking over coffee at a round table">
<title>Your dashboard · Nestorly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
main{max-width:1180px;margin:0 auto;padding-block:48px 90px;display:flex;flex-direction:column;gap:26px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.times{display:flex;flex-direction:column;gap:8px}
.decl{display:flex;flex-direction:column;gap:10px}
.decl .tick{font-size:17px;padding:10px 14px}
.total{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.total .big{font-family:var(--head);font-size:clamp(54px,7vw,88px);line-height:.9;color:var(--green)}
.private{display:inline-flex;gap:8px;align-items:center;font-family:var(--ui);font-weight:700;font-size:15px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;background:var(--soft)}
.certs{display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:28px}
.cq{container-type:inline-size}
.ccert{border:3px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.c1{aspect-ratio:4/5;background:#fff;position:relative;overflow:hidden;color:var(--navy)}
.c1 .frame{position:absolute;inset:4.5cqw;border:.5cqw solid var(--navy);outline:.25cqw solid var(--navy);outline-offset:-2.2cqw}
.c1 .in{position:absolute;inset:4.5cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2cqw;padding:9cqw 8cqw 11cqw}
.c1 .logo{height:13cqw;width:auto}
.c1 .k{font-family:var(--ui);font-weight:600;font-size:3.2cqw;letter-spacing:.32em;text-transform:uppercase;color:var(--cobalt)}
.c1 .photo{width:24cqw;height:24cqw;border-radius:50%;border:.6cqw solid var(--navy);background:#E9E4D8;display:grid;place-items:end center;overflow:hidden;margin-block:1cqw}
.c1 .photo svg{width:78%;height:78%}
.c1 .nm{font-family:var(--head);font-size:6cqw;line-height:1.08}
.c1 .rule{width:16cqw;height:.4cqw;background:var(--navy);margin-block:.6cqw}
.c1 .amt{font-family:var(--head);font-size:12cqw;line-height:.9;color:#18743a}
.c1 .to{font-size:3.4cqw;line-height:1.35}
.c1 .to b{font-family:var(--ui);font-weight:700;display:block;font-size:4cqw}
.c1 .date{position:absolute;right:10cqw;top:9cqw;font-family:var(--ui);font-weight:500;font-size:2.8cqw;color:var(--muted)}
.ok-msg{background:#D6F1E1;border:3px solid var(--ink);border-radius:14px;padding:14px 18px;font-size:18px;margin:0}
.empty{color:var(--muted);font-size:18px;border:3px dashed var(--ink);border-radius:16px;padding:20px;margin:0}
@media (max-width:760px){.certs{grid-template-columns:1fr}}
.rq{display:flex;flex-direction:column;gap:16px}
.goal{background:#FCEFC7;border:3px solid var(--ink);border-radius:14px;padding:14px 18px;box-shadow:4px 4px 0 var(--ink)}
.goal p{margin:6px 0 0;font-size:19px;font-weight:600}
.rsec{display:flex;flex-direction:column;gap:8px}
.rsec ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.panel2{background:var(--white);border:3px solid var(--ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px}
.firmbox{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.firmbox-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.decl{display:flex;flex-direction:column;gap:10px}
.decl .tick{font-size:17px;padding:10px 14px}
.decl .tick.chk{border-color:#1F9D55;background:#EAF7EF;font-weight:700}
.times{display:flex;flex-direction:column;gap:8px}
.panel2 h3{margin:0;font-family:var(--head);font-weight:400;font-size:28px;text-transform:uppercase}
.panel2.acc{border-color:var(--green);box-shadow:5px 5px 0 var(--green)}
.panel2.dec{box-shadow:5px 5px 0 var(--ink)}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sec2{margin:0;font-family:var(--head);font-weight:400;font-size:32px;line-height:1.1;text-transform:uppercase;color:var(--navy)}
/* To do */
.todo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tcard{border:3px solid var(--ink);border-radius:18px;background:var(--paper);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.tcard h3{margin:0;font-family:var(--ui);font-size:19px;display:flex;gap:10px;align-items:center}
.tcard h3 .badge{background:var(--navy)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:2px solid #E2DACA;padding-top:12px}
.trow b{font-family:var(--ui);font-size:17px;display:block}
.trow span{color:var(--muted);font-size:16px}
.trow .btn{flex:none}
.tcard.wide{grid-column:1/-1}
.tcard.found{background:#FCEFC7}
.allclear{font-size:19px}
/* segmented filter */
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;align-self:flex-start}
.seg button{all:unset;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:16px;padding:10px 18px;color:var(--navy);background:#fff}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#F5F0E6}
.seg button:focus-visible{outline:3px solid var(--cobalt);outline-offset:-5px}
.back{all:unset;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:17px;color:var(--navy);text-decoration:underline;text-underline-offset:4px;align-self:flex-start}
/* messages */
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;background:#fff;font-size:18px}
.msg.me{align-self:flex-end;background:#DCE5FF}
.msg small{display:block;color:var(--muted);font-size:14px;font-family:var(--ui);font-weight:600;margin-bottom:2px}
.msgform{display:flex;gap:10px;align-items:flex-end}
.msgform textarea{flex:1;min-height:60px;font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--paper);color:var(--navy)}
/* questions */
.q{border:3px solid var(--ink);border-radius:18px;background:var(--paper);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.q h3{margin:0;font-family:var(--ui);font-size:21px}
.q p{margin:0}
.q .meta{color:var(--muted);font-size:16px}
.q textarea{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;background:#fff;color:var(--navy)}
.handnote{border-left:5px solid var(--green);padding:6px 12px;background:#fff;white-space:pre-line;font-size:17px}
/* donations */
.total{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.total .big{font-family:var(--head);font-size:clamp(54px,7vw,88px);line-height:.9;color:#18743a}
.private{display:inline-flex;gap:8px;align-items:center;font-family:var(--ui);font-weight:700;font-size:15px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;background:var(--soft)}
.tgl{all:unset;cursor:pointer;display:inline-flex;gap:12px;align-items:center;font-family:var(--ui);font-weight:700;font-size:17px;color:var(--navy)}
.tgl i{width:52px;height:30px;border-radius:999px;border:3px solid var(--ink);background:#E9E2D3;position:relative;box-sizing:border-box;transition:background .2s ease}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s ease}
.tgl[aria-checked="true"] i{background:#1F9D55}
.tgl[aria-checked="true"] i::after{transform:translateX(22px);background:#fff}
.tgl:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.btn.green{background:#1F9D55;color:#fff}
/* profile form */
.pform{display:flex;flex-direction:column;gap:22px}
.pform fieldset{border:3px solid var(--ink);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:16px;margin:0}
.pform legend{font-family:var(--ui);font-weight:700;font-size:19px;padding:0 6px}
.pform input[type=text],.pform input[type=email],.pform input[type=tel],.pform input[type=number],.pform textarea,.pform select{font:inherit;font-size:19px;color:var(--navy);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box}
.pform textarea{min-height:120px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
label.chip{cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-family:var(--ui);font-weight:600;font-size:16px;background:#fff}
label.chip input{position:absolute;opacity:0;width:1px;height:1px}
label.chip:has(input:checked){background:var(--ink);color:#fff}
label.chip:has(input:focus-visible){outline:3px solid var(--cobalt);outline-offset:2px}
label.chip.off{opacity:.4;cursor:not-allowed}
.jobrow{display:grid;grid-template-columns:2fr 1fr;gap:10px;border-top:2px solid #E2DACA;padding-top:12px}
.jobrow textarea{grid-column:1/-1;min-height:70px}
.statusbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:3px solid var(--ink);border-radius:16px;padding:16px 20px;background:var(--paper)}
.rcpt{padding:0;border:0;background:none;max-width:none;max-height:none;overflow:visible}
.rcpt::backdrop{background:rgba(20,37,79,.8)}
@media (max-width:760px){.todo{grid-template-columns:1fr}.trow{flex-wrap:wrap}.msg{max-width:92%}.jobrow{grid-template-columns:1fr}.msgform{flex-direction:column;align-items:stretch}}
.counter{border-top:2px solid #E2DACA;padding-top:12px;display:flex;flex-direction:column;gap:12px}
.counter summary{cursor:pointer;font-family:var(--ui);font-weight:700;font-size:17px;color:var(--navy)}
.counter[open]{gap:14px}
.counter .row{margin-top:12px}
.counter .btn{margin-top:12px;align-self:flex-start}
.counter input{font:inherit;font-size:19px;color:var(--navy);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
</style>
</head><body>
<header id="site-head"></header>
<main class="gut">
  <div class="hello">
    <div><span class="eyebrow">Expert dashboard</span><h1 class="page" id="hi">Hello</h1></div>
    <a class="btn ghost sm" id="asfirms" href="find.html">See my profile as firms do</a>
  </div>
  <div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
  </div>
</main>
<dialog class="rcpt" id="rcpt" aria-labelledby="rcpt-h"><div class="gatecard" id="rcpt-in"></div></dialog>
<footer id="site-foot"></footer>
<script src="store.js"></script>
<script src="site.js"></script>
<script src="expert-dashboard.js"></script>
</body></html>
