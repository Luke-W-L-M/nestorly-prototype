<title>My bookings · Nestorly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
main{max-width:1180px;margin:0 auto;padding-block:48px 90px;display:flex;flex-direction:column;gap:26px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.pay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.ref{font-family:var(--ui);font-weight:700;font-size:26px;letter-spacing:.06em;border:3px dashed var(--ink);border-radius:12px;padding:8px 16px;background:var(--white);display:inline-block}
.upload{border:3px dashed var(--ink);border-radius:14px;padding:16px;background:var(--white);display:flex;flex-direction:column;gap:10px}
.upload input{font-size:17px}
table{width:100%;border-collapse:collapse;font-size:18px}
th,td{text-align:left;padding:12px 10px;border-bottom:2px solid var(--soft);vertical-align:top}
th{font-family:var(--ui);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.tw{overflow-x:auto}
.ok-msg{background:#D6F1E1;border:3px solid var(--ink);border-radius:14px;padding:14px 18px;font-size:18px}
.switch{display:flex;gap:14px;align-items:center;font-size:18px}
.switch input{width:24px;height:24px;accent-color:var(--cobalt)}
.stars{display:flex;gap:6px}
.stars button{font-size:26px;background:none;border:none;cursor:pointer;color:var(--soft);padding:0 2px;-webkit-text-stroke:1.5px var(--ink)}
.stars button.on{color:var(--amber)}
.cq{container-type:inline-size}
.cert{aspect-ratio:4/5;background:#fff;position:relative;overflow:hidden;color:var(--navy)}
.c1 .frame{position:absolute;inset:4.5cqw;border:.5cqw solid var(--navy);outline:.25cqw solid var(--navy);outline-offset:-2.2cqw}
.c1 .in{position:absolute;inset:4.5cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2cqw;padding:9cqw 8cqw 11cqw}
.c1 .logo{height:13cqw;width:auto}
.c1 .k{font-family:var(--ui);font-weight:600;font-size:3.2cqw;letter-spacing:.32em;text-transform:uppercase;color:var(--cobalt)}
.c1 .chn{font-family:var(--head);font-size:7.4cqw;line-height:1.05;margin-top:2cqw}
.c1 .rule{width:16cqw;height:.4cqw;background:var(--navy);margin-block:.6cqw}
.c1 .amt{font-family:var(--head);font-size:12cqw;line-height:.9;color:#18743a}
.c1 .to{font-size:3.4cqw;line-height:1.4}
.c1 .to b{font-family:var(--ui);font-weight:700}
.c1 .list{font-family:var(--ui);font-weight:700;font-size:3.4cqw;line-height:1.5}
.c1 .date{position:absolute;right:10cqw;top:9cqw;font-family:var(--ui);font-weight:500;font-size:2.8cqw;color:var(--muted)}
.certs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.yr{background:var(--white);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:22px;display:flex;flex-direction:column;gap:12px}
dialog.cd{width:min(560px,calc(100vw - 32px));max-height:92vh;padding:0;border:3px solid var(--ink);border-radius:22px;box-shadow:10px 10px 0 var(--ink);background:var(--paper);color:var(--navy)}
dialog.cd::backdrop{background:rgba(20,37,79,.62)}
.cd .wrap{padding:24px;display:flex;flex-direction:column;gap:16px}
.cd .ccert{border:3px solid var(--ink);border-radius:6px;overflow:hidden}
.cd .x{align-self:flex-end;background:none;border:none;font-size:30px;cursor:pointer;line-height:1;color:var(--navy)}
.cd .post{font-size:17px;background:var(--white);border:2px solid var(--soft);border-radius:12px;padding:12px 14px;margin:0}
@media (max-width:760px){.certs{grid-template-columns:1fr}}
@media (max-width:760px){.pay{grid-template-columns:1fr}}
.ok-msg{margin:0}
.tabs button{font-size:16px;padding:11px 14px}
.tabs button[aria-selected="true"]{padding-bottom:14px}
.btn.tang,.panel .btn:not(.ghost):not(.green){background:#FF7A1A;color:#14254F}
.btn.tang:hover,.panel .btn:not(.ghost):not(.green):hover{background:#E86A0C}
.panel .btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.empty{color:var(--muted);font-size:18px;border:3px dashed var(--ink);border-radius:16px;padding:20px;margin:0}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sec2{margin:0;font-family:var(--head);font-weight:400;font-size:32px;line-height:1.1;text-transform:uppercase;color:var(--navy)}
.todo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tcard{border:3px solid var(--ink);border-radius:18px;background:var(--paper);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.tcard h3{margin:0;font-family:var(--ui);font-size:19px;display:flex;gap:10px;align-items:center}
.tcard h3 .badge{background:var(--navy)}
.tcard.wide{grid-column:1/-1}
.trow{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:2px solid #E2DACA;padding-top:12px}
.trow b{font-family:var(--ui);font-size:17px;display:block}
.trow span{color:var(--muted);font-size:16px}
.trow .btn{flex:none}
.seg{display:inline-flex;flex-wrap:wrap;border:3px solid var(--ink);border-radius:12px;overflow:hidden;align-self:flex-start}
.seg button{all:unset;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:16px;padding:10px 16px;color:var(--navy);background:#fff}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#F5F0E6}
.seg button:focus-visible{outline:3px solid var(--navy);outline-offset:-5px}
.back{all:unset;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:17px;color:var(--navy);text-decoration:underline;text-underline-offset:4px;align-self:flex-start}
.back:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.goal{background:#FCEFC7;border:3px solid var(--ink);border-radius:14px;padding:14px 18px;box-shadow:4px 4px 0 var(--ink)}
.goal p{margin:6px 0 0;font-size:19px;font-weight:600}
.rsec{display:flex;flex-direction:column;gap:8px}
.rsec ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.panel2{background:var(--white);border:3px solid var(--ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.panel2 h3{margin:0;font-family:var(--head);font-weight:400;font-size:28px;text-transform:uppercase}
.panel2.acc{border-color:var(--green);box-shadow:5px 5px 0 var(--green)}
.xcard{display:flex;gap:18px;align-items:center;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:16px 18px}
.xcard .av{flex:none;width:64px;height:64px;border-radius:14px;border:3px solid var(--ink);background:#E9E2D3;display:grid;place-items:end center;overflow:hidden}
.xcard .av svg{width:50px;height:50px}
.xcard b{font-family:var(--ui);font-size:19px;display:block}
.xcard span{color:var(--muted);font-size:16px}
.xcard .acts{margin-left:auto}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;background:#fff;font-size:18px}
.msg.me{align-self:flex-end;background:#FFE7D4}
.msg small{display:block;color:var(--muted);font-size:14px;font-family:var(--ui);font-weight:600;margin-bottom:2px}
.msgform{display:flex;gap:10px;align-items:flex-end}
.msgform textarea{flex:1;min-height:60px;font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--paper);color:var(--navy)}
.q{border:3px solid var(--ink);border-radius:18px;background:var(--paper);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.q h3{margin:0;font-family:var(--ui);font-size:21px}
.q p{margin:0}
.q .meta{color:var(--muted);font-size:16px}
.hand{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-top:2px solid #E2DACA;padding-top:12px}
.hand .note2{white-space:pre-line;font-size:17px;border-left:5px solid var(--green);padding:4px 12px;background:#fff;margin-top:6px}
.qform{display:flex;flex-direction:column;gap:14px;border:3px solid var(--ink);border-radius:18px;background:#FFF6EC;padding:20px 22px}
.qform input,.qform select,.qform textarea,.oform input,.oform select{font:inherit;font-size:19px;color:var(--navy);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box}
.qform textarea{min-height:100px}
.oform{display:flex;flex-direction:column;gap:18px}
.oform fieldset{border:3px solid var(--ink);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;margin:0}
.oform legend{font-family:var(--ui);font-weight:700;font-size:19px;padding:0 6px}
.oform input[readonly]{background:#F5F0E6}
.tgl{all:unset;cursor:pointer;display:inline-flex;gap:12px;align-items:center;font-family:var(--ui);font-weight:700;font-size:17px;color:var(--navy)}
.tgl i{width:52px;height:30px;border-radius:999px;border:3px solid var(--ink);background:#E9E2D3;position:relative;box-sizing:border-box;flex:none}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s ease}
.tgl[aria-checked="true"] i{background:#1F9D55}
.tgl[aria-checked="true"] i::after{transform:translateX(22px);background:#fff}
.tgl:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.team li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid #E2DACA;padding-top:10px}
.teamform{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:12px;align-items:end}
@media (max-width:760px){.teamform{grid-template-columns:1fr}}
.team{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.todo{grid-template-columns:1fr}.trow{flex-wrap:wrap}.msg{max-width:92%}.msgform{flex-direction:column;align-items:stretch}.xcard{flex-wrap:wrap}.xcard .acts{margin-left:0}}
.counter{border-top:2px solid #E2DACA;padding-top:12px;display:flex;flex-direction:column;gap:12px}
.counter summary{cursor:pointer;font-family:var(--ui);font-weight:700;font-size:17px;color:var(--navy)}
.counter[open]{gap:14px}
.counter .row{margin-top:12px}
.counter .btn{margin-top:12px;align-self:flex-start}
.counter input{font:inherit;font-size:19px;color:var(--navy);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
.ccert{border:3px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.certs{grid-template-columns:repeat(2,minmax(0,360px))}
.paybox{border:3px solid var(--ink);border-radius:16px;background:#FFF6EC;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sample{all:unset;cursor:pointer;align-self:flex-start;font-family:var(--ui);font-weight:700;font-size:15px;color:var(--navy);border:2px dashed #C9C2B3;border-radius:10px;padding:6px 12px}
.sample:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
</style>
</head><body>
<header id="site-head"></header>
<main class="gut">
  <div class="hello">
    <div><span class="eyebrow" id="orgname">Firm dashboard</span><h1 class="page" id="hi">Hello</h1></div>
    <a class="btn sm tang" href="find.html">Find an expert</a>
  </div>
  <div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
  </div>
</main>
<footer id="site-foot"></footer>
<script src="store.js"></script>
<script src="site.js"></script>
<script src="firm-dashboard.js"></script>
</body></html>
